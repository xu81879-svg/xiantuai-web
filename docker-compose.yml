name: xiantu

x-backend: &backend
  build: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-xiantu}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-xiantu}
    REDIS_URL: redis://redis:6379/0
    LOCAL_STORAGE_DIR: /data
    DATABASE_FILE: /data/xiantu.db
  volumes:
    - storage:/data
  restart: on-failure
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xiantu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-xiantu}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiantu -d xiantu"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # 不暴露 5432；需要本机调试时使用临时 override 文件绑定 127.0.0.1。

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # 不暴露 6379；Redis 仅供 Compose 内部服务访问。

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_started
    restart: on-failure

volumes:
  pg:
  redis:
  storage:
